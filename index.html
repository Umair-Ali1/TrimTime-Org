<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5">
  <meta name="description" content="TrimTime — Pakistan's #1 salon booking platform. Find and book top salons near you in seconds. Real-time availability, choose your barber, instant confirmation.">
  <meta name="theme-color" content="#2563EB">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="mobile-web-app-capable" content="yes">
  <meta property="og:title" content="TrimTime — Book Your Perfect Look">
  <meta property="og:description" content="Pakistan's #1 salon booking platform. Book top salons in seconds.">
  <meta property="og:type" content="website">
  <title>TrimTime — Book Your Perfect Look</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✂️</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="toastContainer"></div>
  <div id="app"></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
  <script>
    (async function () {
      const modules = ['landing','auth','home','booking','customer','owner','employee','admin','modals'];
      const app = document.getElementById('app');
      for (const m of modules) {
        const res = await fetch(m + '/index.html');
        app.insertAdjacentHTML('beforeend', await res.text());
      }
      const s = document.createElement('script');
      s.src = 'app_state.js?v=' + Date.now();
      document.body.appendChild(s);
    })();
  </script>
</body>
</html>
