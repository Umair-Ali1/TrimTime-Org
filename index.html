<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>TrimTime — Book Your Perfect Look</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✂️</text></svg>">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="toastContainer"></div>
  <div id="app"></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
  <script>
    (async function () {
      const modules = ['landing','auth','home','booking','customer','owner','employee','admin','modals'];
      const app = document.getElementById('app');
      for (const m of modules) {
        const res = await fetch(m + '/index.html');
        app.insertAdjacentHTML('beforeend', await res.text());
      }
      const s = document.createElement('script');
      s.src = 'app_state.js';
      document.body.appendChild(s);
    })();
  </script>
</body>
</html>
